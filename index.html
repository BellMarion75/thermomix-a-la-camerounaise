<style>
:root{
  --bg:#fbf6ee; --card:#fffdf9; --ink:#2b1d14; --muted:#7a6656;
  --green:#1f6b45; --green-d:#174f34; --red:#c0392b; --sun:#e9a91f;
  --line:#ecdfcd; --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.15;margin:0}
a{color:var(--green)}
button{font:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* header */
header{position:sticky;top:0;z-index:10;background:rgba(251,246,238,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:19px;text-decoration:none;color:var(--ink)}
.flag{display:inline-flex;width:28px;height:20px;border-radius:4px;overflow:hidden}
.flag i{flex:1}.flag i:nth-child(1){background:var(--green)}.flag i:nth-child(2){background:var(--red);position:relative}.flag i:nth-child(3){background:var(--sun)}
.flag i:nth-child(2)::after{content:"★";position:absolute;inset:0;display:grid;place-items:center;color:var(--sun);font-size:9px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 12px;font-weight:700;color:var(--muted)}
.lang button.on{background:var(--ink);color:#fff}

/* hero */
.hero{padding:56px 0 36px;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(34px,5vw,56px)}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p{color:var(--muted);font-size:18px;max-width:540px}
.pill{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;margin-bottom:16px}
.hero-art{aspect-ratio:1;border-radius:50%;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;background:#1f6b45;border:10px solid #1f6b45;box-shadow:0 30px 60px -30px rgba(31,107,69,.6)}
.hero-art img{width:100%;height:100%;object-fit:cover;display:block}
.steps{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:15px}
.steps b{color:var(--ink)}

/* filters + grid */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 22px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:500}
.filters button.on{background:var(--green);border-color:var(--green);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;padding-bottom:60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;cursor:pointer;text-align:left;padding:0;color:inherit}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px -24px rgba(43,29,20,.45)}
.thumb{height:160px;display:grid;place-items:center;font-size:64px;overflow:hidden}
.thumb img,.d-hero img{width:100%;height:100%;object-fit:cover;display:block;font-size:13px;color:var(--muted)}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:21px}
.meta{color:var(--muted);font-size:14px}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px}
.price{font-weight:700;font-size:18px}
.cta{background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}

/* detail */
#detail{display:none;padding:28px 0 70px}
.back{border:0;background:none;color:var(--green);font-weight:700;padding:0;margin-bottom:18px}
.detail{display:grid;grid-template-columns:1fr 340px;gap:36px;align-items:start}
.d-hero{height:300px;border-radius:var(--radius);display:grid;place-items:center;font-size:110px;margin-bottom:24px;overflow:hidden}
.detail h1{font-size:clamp(30px,4vw,44px);margin-bottom:8px}
.desc{color:var(--muted);font-size:17px}
.section{margin-top:30px}
.section h2{font-size:24px;margin-bottom:12px}
.ing{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.ing li:first-child{border-top:0}
.ing li span:last-child{color:var(--muted);white-space:nowrap}
.locked{position:relative}
.locked .ghost{filter:blur(5px);user-select:none;pointer-events:none;opacity:.6}
.ghost .ln{height:12px;border-radius:6px;background:#d8c9b4;margin:6px 0}
.lock-over{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px}
.lock-over div{background:rgba(255,253,249,.94);border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-weight:700;box-shadow:0 10px 30px -18px rgba(0,0,0,.4)}
.ghost-step{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.ghost-step:first-child{border-top:0}
.ghost-step .n{width:26px;height:26px;border-radius:50%;background:#d8c9b4;flex:none}
.ghost-step .t{flex:1}
.box{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}

.buy{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 20px 50px -34px rgba(43,29,20,.5)}
.buy .big{font-family:Georgia,"Times New Roman",serif;font-size:42px;font-weight:700}
.buy ul{padding-left:18px;color:var(--muted);margin:12px 0 18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;text-decoration:none;margin-top:10px}
.btn-pp{background:#ffc439;color:#111}
.btn-iban{background:var(--green);color:#fff}
.btn-iban:hover{background:var(--green-d)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.facts{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.fact{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.fact b{display:block;font-size:16px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(43,29,20,.55);display:none;place-items:center;z-index:50;padding:18px}
.modal.open{display:grid}
.sheet{background:var(--card);border-radius:20px;max-width:460px;width:100%;padding:24px;max-height:92vh;overflow:auto}
.sheet h3{font-size:24px;margin-bottom:6px}
.kv{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 14px;margin:14px 0}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.kv div:first-child{border-top:0}
.kv span:first-child{color:var(--muted)}
.kv b{font-family:ui-monospace,monospace;word-break:break-all;text-align:right}
.copy{border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 8px;font-size:12px;margin-left:6px}
label{display:block;font-weight:700;font-size:14px;margin-top:12px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-top:4px;background:#fff}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.ok{background:#e8f4ec;border:1px solid #b9dcc6;border-radius:12px;padding:12px 14px;margin-top:14px}
.x{float:right;border:0;background:none;font-size:22px;line-height:1;color:var(--muted)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.legal h4{margin:14px 0 4px;font-size:15px}.legal p{margin:0 0 8px;font-size:14px;color:#4a3a2e}
.consent{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:13px;color:var(--muted);margin-top:12px}.consent input{width:auto;margin-top:3px}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}.hero-art{display:none}
  .detail{grid-template-columns:1fr}.buy{position:static}
}
</style>
</head>

let L = "fr", cat = "all", current = null;
const $ = s => document.querySelector(s);
const eur = n => L==="en" ? "€" + n.toFixed(2) : n.toFixed(2).replace(".", ",") + " €";
const t = k => T[L][k];

function applyStatic(){
  document.documentElement.lang = L;
  document.querySelectorAll("[data-t]").forEach(el => el.innerHTML = t(el.dataset.t));
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === L));
}
function renderFilters(){
  $("#filters").innerHTML = ["all","plat","sauce","accomp","snack","condiment"].map(c =>
    `<button class="${c===cat?"on":""}" data-c="${c}">${t(c)}</button>`).join("");
  $("#filters").querySelectorAll("button").forEach(b => b.onclick = () => {cat=b.dataset.c; renderFilters(); renderGrid();});
}
function renderGrid(){
  $("#grid").innerHTML = RECIPES.filter(r => cat==="all"||r.cat===cat).map(r => `
    <button class="card" data-id="${r.id}">
      <div class="thumb" style="background:${r.bg};position:relative">${r.img?`<img src="${r.img}" alt="${nm(r)}" loading="lazy">`:r.emoji}${r.cookidoo?`<span style="position:absolute;top:10px;right:10px;background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--green)">✓ ${t("cookBadge")}</span>`:""}</div>
      <div class="body">
        <h3>${nm(r)}</h3>
        <div class="meta">${r.time?`⏱ ${r.time} · 👥 ${srv(r)} · ${t("lv")[levelOf(r)-1]}`:t(r.cat)}</div>
        <div class="meta">${dsc(r)}</div>
        <div class="foot"><span class="price">${eur(SHOP.price)}</span><span class="cta">${t("see")}</span></div>
      </div>
    </button>`).join("");
  $("#grid").querySelectorAll(".card").forEach(c => c.onclick = () => openRecipe(c.dataset.id));
}
/* Schwierigkeit: bis 1 h = einfach, 1–2 h = mittel, über 2 h = schwer.
   Mehr als 7 Schritte = mindestens mittel, mehr als 10 Schritte = schwer. */
function minutesOf(s){ if(!s) return 0; let m=0; const h=s.match(/(\d+(?:[.,]\d+)?)\s*h/); if(h) m+=parseFloat(h[1].replace(",","."))*60;
  const mm=s.match(/(\d+)\s*min/)||s.match(/h\s*(\d+)$/); if(mm) m+=parseInt(mm[1]); return m; }
function levelOf(r){ const m=minutesOf(r.time); if(!m) return 0; let l=m<=60?1:m<=120?2:3; const st=r.steps||0; if(st>10) l=3; else if(st>7) l=Math.max(l,2); return l; }
const nm = r => (L!=="fr" && r.name[L] && r.name[L]!==r.name.fr) ? `${r.name[L]} (${r.name.fr})` : r.name.fr;
const dsc = r => (r.desc && r.desc[L]) || t("soonDesc");
const qty = q => typeof q==="object" ? q[L] : q;
const srv = r => r.yield ? r.yield[L] : (r.serves ? `${r.serves} ${t("pers")}` : "");
function ghostLines(n){ let s=""; for(let i=0;i<n;i++) s+=`<li><span class="ln" style="width:${40+((i*37)%45)}%"></span><span class="ln" style="width:50px"></span></li>`; return s; }
function openRecipe(id){
  current = RECIPES.find(r => r.id===id); if(!current) return;
  const r = current;
  location.hash = r.id;
  $("#home").style.display="none"; $("#detail").style.display="block"; window.scrollTo(0,0);
  const lv=levelOf(r); const stars = lv?"●".repeat(lv)+"○".repeat(3-lv)+" "+t("lv")[lv-1]:"–"; const hid=r.hidden||6, stp=r.steps||6;
  let ghostSteps=""; for(let i=0;i<Math.min(stp,5);i++) ghostSteps+=`<div class="ghost-step"><span class="n"></span><div class="t"><div class="ln" style="width:90%"></div><div class="ln" style="width:${55+i*7}%"></div></div></div>`;
  $("#detail").innerHTML = `
    <button class="back" id="back">${t("back")}</button>
    <div class="detail">
      <div>
        <div class="d-hero" style="background:${r.bg}">${r.img?`<img src="${r.img}" alt="${nm(r)}">`:r.emoji}</div>
        <h1>${nm(r)}</h1>
        <p class="desc">${dsc(r)}</p>
        <div class="facts">
          <div class="fact">${t("time")}<b>${r.time||"–"}</b></div>
          <div class="fact">${r.yield?t("qtyL"):t("serves")}<b>${srv(r)||"–"}</b></div>
          <div class="fact">${t("level")}<b>${stars}</b></div>
        </div>
        <div class="section">
          <h2>${t("ing")}</h2>
          <ul class="ing">
            ${r.ing.length?r.ing.map(i=>`<li><span>${i[L]}</span><span>${qty(i.q)}</span></li>`).join(""):`<li><span style="color:var(--muted)">${t("soon")}</span><span></span></li>`}
          </ul>
          ${(r.ing.length && !r.hidden)?"":`<div class="locked box" style="margin-top:-1px">
            <ul class="ing ghost" style="border:0">${ghostLines(hid)}</ul>
            <div class="lock-over"><div>${r.hidden?t("more")(r.hidden):t("unlock")}</div></div>
          </div>`}
        </div>
        <div class="section">
          <h2>${t("prep")}</h2>
          <div class="locked box">
            <div class="ghost">${ghostSteps}</div>
            <div class="lock-over"><div>${t("unlock")}<br><span style="font-weight:400;color:var(--muted);font-size:14px">${r.steps?t("steps")(r.steps):""}</span></div></div>
          </div>
        </div>
      </div>
      <aside class="buy">
        <div class="meta">${nm(r)}</div>
        <div class="big">${eur(SHOP.price)}</div>
        <ul>${t("incl").map(x=>`<li>${x}</li>`).join("")}${r.cookidoo?`<li><b>${t("cookidoo")}</b></li>`:""}</ul>
        <button class="btn btn-pp" id="bpp">🅿️ ${t("payPP")}</button>
        <button class="btn btn-iban" id="bib">🏦 ${t("payIB")}</button>
      </aside>
    </div>`;
  $("#back").onclick = showHome;
  $("#bpp").onclick = () => openPay("pp");
  $("#bib").onclick = () => openPay("iban");
}
function showHome(){
  current=null; history.replaceState(null,"",location.pathname);
  $("#detail").style.display="none"; $("#home").style.display="block";
}
function refCode(){ return "REZ-" + current.id.toUpperCase().slice(0,8) + "-" + Math.random().toString(36).slice(2,6).toUpperCase(); }
function row(k,v,copy){ return `<div><span>${k}</span><b>${v}${copy?` <button class="copy" data-c="${v}">${t("copy")}</button>`:""}</b></div>`; }
function openPay(kind){

  const ppUrl=SHOP.paypalMe ? `https://www.paypal.me/${encodeURIComponent(SHOP.paypalMe)}/${SHOP.price}EUR` : SHOP.paypalUrl;
  const top = kind==="pp"
    ? `<h3>${t("ppTitle")}</h3><p class="meta">${t("ppText")} <b>${amt}</b> ${t("ppText2")}</p>
       <div class="kv">${row(t("ref"),ref,true)}${row(t("amount"),amt)}</div>
       <a class="btn btn-pp" href="${ppUrl}" target="_blank" rel="noopener">🅿️ ${t("ppOpen")}</a>
       <div style="text-align:center;margin-top:12px"><img src="${SHOP.paypalQr}" alt="PayPal QR" style="width:150px;height:150px;border-radius:10px;border:1px solid var(--line)"><p class="note" style="margin-top:4px">${t("ppScan")}</p></div>`
    : `<h3>${t("ibTitle")}</h3><p class="meta">${t("ibText")}</p>
       <div class="kv">${row(t("owner"),SHOP.ibanOwner)}${row("IBAN",SHOP.iban,true)}${row("BIC",SHOP.bic,true)}${row(t("bank"),SHOP.bank)}${row(t("amount"),amt)}${row(t("ref"),ref,true)}</div>`;
  $("#sheet").innerHTML = `<button class="x" id="cls" aria-label="close">×</button>${top}
    <form id="ord">
      <p style="font-weight:700;margin:20px 0 0">${t("after")}</p>
      <label>${t("name")}<input id="oname" required autocomplete="name"></label>
      <label>${t("mail")}<input id="omail" type="email" required autocomplete="email"></label>
      <label class="consent"><input type="checkbox" id="oconsent" required><span>${t("consent")} <a href="#" id="wlink">${t("withdraw")}</a></span></label>
      <button class="btn btn-iban" type="submit">${t("send")}</button>
      <p class="note">${t("sendNote")}</p>
    </form><div id="done"></div>`;
  $("#modal").classList.add("open");
  $("#cls").onclick = closeModal;
  $("#sheet").querySelectorAll(".copy").forEach(b => b.onclick = async () => {
    try{ await navigator.clipboard.writeText(b.dataset.c); b.textContent=t("copied"); }catch(e){}
  });
  $("#wlink").onclick = e => { e.preventDefault(); openLegal("withdraw"); };
  $("#ord").onsubmit = e => {
    e.preventDefault();
    const name=$("#oname").value.trim(), mail=$("#omail").value.trim();
    const msg=`${t("order")}: ${nm(r)}\n${t("ref")}: ${ref}\n${t("amount")}: ${amt}\n${t("payment")}: ${kind==="pp"?"PayPal":"IBAN"}\n${t("name")}: ${name}\n${t("mail")}: ${mail}\n${t("consentShort")}`;
    const mailto=`mailto:${SHOP.email}?subject=${encodeURIComponent(t("order")+" "+nm(r)+" – "+ref)}&body=${encodeURIComponent(msg)}`;
    const wa=`https://wa.me/${SHOP.whatsapp}?text=${encodeURIComponent(msg)}`;
    $("#ord").style.display="none";
    $("#done").innerHTML = `<div class="ok"><b>${t("okT")}</b> ${t("okB")}
      <a class="btn btn-iban" href="${mailto}">✉️ ${t("byMail")}</a>
      <a class="btn btn-ghost" href="${wa}" target="_blank" rel="noopener">💬 ${t("byWa")}</a>
      <p class="note">${SHOP.email}</p></div>`;
  };
}
function closeModal(){ $("#modal").classList.remove("open"); }
function openLegal(kind){
  kind = kind || "imprint";
  const tabs=["imprint","privacy","withdraw","terms"].map(k=>`<button data-k="${k}" class="${k===kind?"on":""}">${t(k)}</button>`).join("");
  $("#sheet").innerHTML = `<button class="x" id="cls" aria-label="close">×</button><h3>${t("legal")}</h3><div class="tabs">${tabs}</div><div class="legal">${LEGAL[L][kind]}</div>`;
  $("#modal").classList.add("open"); $("#cls").onclick = closeModal;
  $("#sheet").querySelectorAll(".tabs button").forEach(b => b.onclick = () => openLegal(b.dataset.k));
}
document.querySelectorAll("[data-legal]").forEach(a => a.onclick = e => { e.preventDefault(); openLegal(a.dataset.legal); });
$("#modal").onclick = e => { if(e.target.id==="modal") closeModal(); };
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  L=b.dataset.l; try{localStorage.setItem("lang",L)}catch(e){}
  applyStatic(); renderFilters(); renderGrid(); if(current) openRecipe(current.id);
});
function route(){ const id=location.hash.slice(1); if(id && RECIPES.some(r=>r.id===id)) openRecipe(id); else showHome(); }
const nl=(navigator.language||"").slice(0,2); if(T[nl]) L=nl;
try{ const s=localStorage.getItem("lang"); if(s && T[s]) L=s; }catch(e){}
$("#yr").textContent = new Date().getFullYear();
applyStatic(); renderFilters(); renderGrid(); route();
window.addEventListener("hashchange", route);
</script>
</body>
</html>
